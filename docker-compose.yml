# ================================================================
# ByteCraft — docker-compose.yml
#
# Convex is hosted (no local database required), so only the
# Next.js app container is needed.
#
# Build:
#   NEXT_PUBLIC vars must be available at build time (Next.js
#   inlines them into client bundles).  Server-only secrets are
#   passed at runtime.
#
# Usage:
#   1. Copy .env.local to .env   (docker compose reads .env)
#   2. docker compose up --build
# ================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
        NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
      - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
