services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=5000
      - --innodb-buffer-pool-size=1G
      - --innodb-buffer-pool-instances=8
      - --innodb-flush-log-at-trx-commit=2
      - --performance_schema=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bytecraft}
      MYSQL_USER: ${MYSQL_USER:-bytecraft}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bytecraft_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"
    networks:
      - bytecraft-net

  migrate:
    image: node:22-alpine
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-bytecraft}:${MYSQL_PASSWORD:-bytecraft_pass}@mysql:3306/${MYSQL_DATABASE:-bytecraft}
    working_dir: /app
    volumes:
      - ./:/app
      - ./node_modules:/app/node_modules
    command: sh -c "npx drizzle-kit migrate --dialect=mysql"
    networks:
      - bytecraft-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-bytecraft}:${MYSQL_PASSWORD:-bytecraft_pass}@mysql:3306/${MYSQL_DATABASE:-bytecraft}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Critical: all replicas must share the SAME server-actions encryption
      # key, otherwise server functions (oRPC) fail across load-balanced nodes.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      DB_POOL_CONNECTION_LIMIT: 100
      DB_POOL_QUEUE_LIMIT: 5000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Scale replicas with: docker compose up --scale app=3 -d
    networks:
      - bytecraft-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bytecraft-net

volumes:
  mysql-data:

networks:
  bytecraft-net:
    driver: bridge
