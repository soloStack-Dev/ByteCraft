worker_processes auto;
worker_rlimit_nofile 32768;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Reflect remote address through proxies
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # -----------------------------------------------
    # Upstream: ByteCraft app replicas.
    # Docker DNS resolves `app` to every scaled replica,
    # and `least_conn` routes to the least-busy worker.
    # -----------------------------------------------
    upstream bytecraft_app {
        zone bytecraft_app 64k;
        least_conn;

        server app:3000 max_fails=5 fail_timeout=30s;

        keepalive 256;
    }

    # Optional: separate upstream dedicated to server-function / oRPC traffic
    # using least_conn to spread async DB-bound procedures evenly.
    upstream bytecraft_rpc {
        zone bytecraft_rpc 32k;
        least_conn;
        server app:3000 max_fails=5 fail_timeout=30s;
        keepalive 128;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Request size for payloads
        client_max_body_size 25m;

        # Rate limiting (per IP) to survive bursts
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
        limit_conn_zone $binary_remote_addr zone=perip:10m;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;
        gzip_min_length 1024;

        # Serve immutable hashed assets with long cache
        location ~* ^/_next/static/.*\.(js|css|woff2?)$ {
            proxy_pass http://bytecraft_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Server functions / oRPC + API get least_conn load balancing
        location ~ ^/(api/|_rsc/|_next/data/)?$ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://bytecraft_rpc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Disable buffering to support streaming responses
            proxy_buffering off;
            proxy_cache off;
        }

        # All other traffic: least_conn across replicas, streaming enabled
        location / {
            limit_conn perip 100;
            proxy_pass http://bytecraft_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
